name: autogram
description: Avtomobillar uchun Reels-formatli platforma
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1
  bloc: ^9.2.0
  equatable: ^2.0.5

  # Dependency Injection
  get_it: ^9.2.0
  injectable: ^2.5.0

  # Navigation
  go_router: ^17.1.0

  # Network
  dio: ^5.7.0
  connectivity_plus: ^7.0.0

  # Supabase
  supabase_flutter: ^2.8.3

  # Local Storage
  sqflite: ^2.4.1
  shared_preferences: ^2.3.4
  flutter_secure_storage: ^10.0.0

  # Localization
  easy_localization: ^3.0.7

  # UI
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.16
  lottie: ^3.2.0
  cupertino_icons: ^1.0.8

  # Video Player
  video_player: ^2.9.2
  chewie: ^1.8.5

  # Forms
  flutter_form_builder: ^10.3.0+1
  form_builder_validators: ^11.0.0

  # Utils
  dartz: ^0.10.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  intl: ^0.20.2
  logger: ^2.5.0
  url_launcher: ^6.3.1
  permission_handler: ^12.0.1
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  uuid: ^4.5.1

  # Firebase (only for FCM)
#  firebase_core: ^4.4.0
#  firebase_messaging: ^16.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.14
  injectable_generator: ^2.6.2
  freezed: ^3.2.3
  json_serializable: ^6.9.0

  # Testing
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/l10n/
